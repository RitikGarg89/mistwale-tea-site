<svg width="230" height="72" viewBox="0 0 230 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Mistvale Tea Co.</title>
  <desc id="logoDesc">Mistvale Tea Co. logo with a leaf emblem.</desc>

  <!-- Circular leaf emblem -->
  <g fill="none" stroke="#f6f1e7">

    <circle cx="36" cy="36" r="25" stroke-width="1.6"></circle>

    <!-- Leaf -->
    <path d="M29 39
         C29 30, 36 25, 43 25
         C43 33, 39 41, 31 43
         C30 42, 29 41, 29 39Z" stroke-width="1.8" stroke-linejoin="round"></path>

    <!-- Leaf stem -->
    <path d="M30 44
         C34 39, 38 35, 42 30" stroke-width="1.5" stroke-linecap="round"></path>
  </g>

  <!-- Brand name -->
  <text x="72" y="37" fill="#f6f1e7" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">
    Mistvale
  </text>

  <!-- Tea Co. -->
  <text x="73" y="53" fill="#f6f1e7" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="500" letter-spacing="3">
    TEA CO.
  </text>
</svg>